# Usa este Blueprint si despliegas el repositorio `backend` por separado.
# Si despliegas el monorepo, usa el render.yaml de la raíz.
services:
  - type: web
    name: beta-aida-invogo-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beta-aida-invogo-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://facturacion-front1.vercel.app
      - key: ALLOWED_FRAME_ANCESTORS
        value: https://app.gohighlevel.com,https://app.leadconnectorhq.com
      - key: SESSION_COOKIE_NAME
        value: aida_session
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: DEMO_PASSWORD
        sync: false
      - key: GHL_INTEGRATION_ENABLED
        value: "false"
      - key: ENABLE_GHL_CONNECTIVITY_SIMULATOR
        value: "true"
      - key: INVOGO_PROVIDER
        value: mock

databases:
  - name: beta-aida-invogo-db
    databaseName: invogo_sandbox
    user: invogo_demo
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
